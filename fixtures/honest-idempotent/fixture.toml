[fixture]
name = "honest-idempotent"
description = "Upsert by key. Idempotent over business state; appends one audit row per call."
# {python} is the harness's interpreter, which has the MCP SDK installed.
command = ["{python}", "server.py"]

[state]
# Ground truth: every place this server keeps state. Coverage is complete only
# if each location is observed by an adapter whose own coverage is complete.
locations = ["sqlite:state.db"]

[[adapters]]
kind = "sqlite"
label = "state.db"
seed = "seed.sql"
business = ["items"]
append_only = ["audit"]
mask = [
    { region = "audit", column = "at", kind = "timestamp" },
    { region = "audit", column = "request_id", kind = "uuid" },
]

[[tools]]
name = "upsert_item"
arguments = { key = "a", value = "new" }

# Expected verdicts. For the idempotence tests the *_changed flags compare one
# call against two; for read_only and destructive they compare one call
# against the control session.
[tools.expected.sequential_idempotence]
verdict = "PASS"
secondary = []
business_changed = false
append_only_changed = true

[tools.expected.concurrent_idempotence]
verdict = "PASS"
business_changed = false
append_only_changed = true

# readOnlyHint:false and destructiveHint:true make no falsifiable claim.
[tools.expected.read_only]
verdict = "NOT_APPLICABLE:PERMISSIVE_DECLARATION"
business_changed = true
append_only_changed = true

[tools.expected.destructive]
verdict = "NOT_APPLICABLE:PERMISSIVE_DECLARATION"
business_changed = true
append_only_changed = true
