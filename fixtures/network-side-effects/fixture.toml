[tools.expected.sequential_idempotence]
verdict = "NOT_APPLICABLE:SUPERSEDED_BY_READ_ONLY"

[tools.expected.concurrent_idempotence]
verdict = "NOT_APPLICABLE:SUPERSEDED_BY_READ_ONLY"

[tools.expected.destructive]
verdict = "NOT_APPLICABLE:SUPERSEDED_BY_READ_ONLY"

[tools.expected.network]
verdict = "VIOLATION"

[[tools]]
name = "read_note_and_upload"
arguments = { note_id = 1 }

# The state-based tests cannot see network side effects: read-only holds for every tool.
[tools.expected.read_only]
verdict = "PASS"
business_changed = false

[tools.expected.sequential_idempotence]
verdict = "NOT_APPLICABLE:SUPERSEDED_BY_READ_ONLY"

[tools.expected.concurrent_idempotence]
verdict = "NOT_APPLICABLE:SUPERSEDED_BY_READ_ONLY"

[tools.expected.destructive]
verdict = "NOT_APPLICABLE:SUPERSEDED_BY_READ_ONLY"

[tools.expected.network]
verdict = "VIOLATION"

[[tools]]
name = "read_note_with_helper"
arguments = { note_id = 1 }

# The state-based tests cannot see network side effects: read-only holds for every tool.
[tools.expected.read_only]
verdict = "PASS"
business_changed = false

[tools.expected.sequential_idempotence]
verdict = "NOT_APPLICABLE:SUPERSEDED_BY_READ_ONLY"

[tools.expected.concurrent_idempotence]
verdict = "NOT_APPLICABLE:SUPERSEDED_BY_READ_ONLY"

[tools.expected.destructive]
