# Audit target: the knowledge-graph memory server from the MCP reference
# servers repository, built from a pinned commit and run in a network-free
# sandbox that can write only inside its state directory.
#
# Audit targets never carry expected verdicts. Every VIOLATION and
# INCONCLUSIVE in an audit report is a measurement to review, not a finding.

[target]
name = "memory"
description = "Knowledge-graph memory server (TypeScript), modelcontextprotocol/servers src/memory."
command = ["node", "{source}/src/memory/dist/index.js"]
# Build and run only under Node 24 LTS; mcpgt refuses any other major version.
node = "24"
# The graph file lives inside the sandboxed state directory.
env = { MEMORY_FILE_PATH = "{state}/memory.jsonl" }

[source]
repository = "https://github.com/modelcontextprotocol/servers.git"
commit = "bbb701e7ac1e57f3edd1c2836b94c5457eaf7b9c"  # main, 2026-10-11
package = "src/memory"
build = [
    ["npm", "ci", "--ignore-scripts", "--no-audit", "--no-fund"],
    ["npm", "run", "build", "--workspace", "src/memory"],
]
artifacts = ["src/memory/dist"]

[state]
# The whole state directory is observed: the sandbox lets the server write
# nowhere else. The graph file is delegated to the JSONL adapter; anything
# else left behind (the server's .lock / .lock.break / temp files) shows up as
# unclassified state in the directory adapter.
locations = ["fs:.", "json:memory.jsonl"]

[[adapters]]
kind = "fs"
label = "."

[[adapters]]
kind = "json"
format = "jsonl"
label = "memory.jsonl"
seed = "seed/memory.jsonl"
partition_by = "type"
explode = { observations = ["name"] }
notes = """\
Modelling choice: each observation is exploded into its own record keyed by \
entity name (region entity.observations). Without it, add_observations \
rewrites the whole entity line and the destructive test would count an \
append as an overwrite, a false destructive VIOLATION. Consequence: the order \
of observations within an entity is not treated as state; in a knowledge \
graph it carries no meaning.\
"""
business = ["entity", "entity.observations", "relation"]

# Call arguments, chosen against the seeded graph so every call does real work.

[[tools]]
name = "create_entities"
arguments = { entities = [{ name = "Carol", entityType = "person", observations = ["Joined in 2026"] }] }

[[tools]]
name = "create_entities"
variant = "existing-name-other-type"
notes = "Alice already exists as a person; same name, different entityType."
arguments = { entities = [{ name = "Alice", entityType = "robot", observations = ["Speaks French"] }] }

[[tools]]
name = "create_entities"
variant = "existing-name-new-observations"
notes = "Bob already exists; the call repeats his type and adds an observation he does not have."
arguments = { entities = [{ name = "Bob", entityType = "person", observations = ["Plays chess", "Owns a boat"] }] }

[[tools]]
name = "create_entities"
variant = "duplicate-in-batch"
notes = "Two new entities with the same name and different types in one call."
arguments = { entities = [
    { name = "Dana", entityType = "person", observations = ["First"] },
    { name = "Dana", entityType = "robot", observations = ["Second"] },
] }

[[tools]]
name = "create_relations"
arguments = { relations = [{ from = "Bob", to = "Acme Corp", relationType = "works_at" }] }

[[tools]]
name = "create_relations"
variant = "missing-endpoint"
notes = "The target entity Zed does not exist."
arguments = { relations = [{ from = "Alice", to = "Zed", relationType = "knows" }] }

[[tools]]
name = "create_relations"
variant = "partial-invalid-batch"
notes = "One valid new relation and one whose endpoint does not exist, in one call."
arguments = { relations = [
    { from = "Bob", to = "Acme Corp", relationType = "works_at" },
    { from = "Bob", to = "Nowhere", relationType = "visits" },
] }

[[tools]]
name = "create_relations"
variant = "new-and-existing"
notes = "One relation that already exists and one new one."
arguments = { relations = [
    { from = "Alice", to = "Acme Corp", relationType = "works_at" },
    { from = "Paris", to = "Alice", relationType = "home_of" },
] }

[[tools]]
name = "add_observations"
arguments = { observations = [{ entityName = "Bob", contents = ["Plays piano"] }] }

[[tools]]
name = "add_observations"
variant = "new-and-existing"
notes = "One observation Alice already has and one she does not."
arguments = { observations = [{ entityName = "Alice", contents = ["Speaks French", "Plays violin"] }] }

[[tools]]
name = "add_observations"
variant = "missing-entity"
notes = "The entity Zed does not exist."
arguments = { observations = [{ entityName = "Zed", contents = ["Unknown"] }] }

[[tools]]
name = "add_observations"
variant = "duplicate-in-call"
notes = "The same new observation twice in one call."
arguments = { observations = [{ entityName = "Bob", contents = ["Owns a boat", "Owns a boat"] }] }

[[tools]]
name = "delete_entities"
arguments = { entityNames = ["Bob"] }

[[tools]]
name = "delete_observations"
arguments = { deletions = [{ entityName = "Alice", observations = ["Speaks French"] }] }

[[tools]]
name = "delete_relations"
arguments = { relations = [{ from = "Alice", to = "Bob", relationType = "knows" }] }

[[tools]]
name = "read_graph"
arguments = {}

[[tools]]
name = "search_nodes"
arguments = { query = "Acme" }

[[tools]]
name = "open_nodes"
arguments = { names = ["Alice", "Acme Corp"] }
