name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:  # the release workflow runs the full suite before publishing

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and type check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --locked
      - run: uv run mcpgt --version
      - run: uv run pytest -ra

  action:
    # The reusable action (action.yml) against the example server, whose one
    # known VIOLATION must fail the gate.
    name: Audit action (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@v5
      # Disables an Ubuntu security restriction. Acceptable only because
      # GitHub-hosted runners are ephemeral; never run this on developer
      # machines, servers or persistent self-hosted runners.
      - name: Allow unprivileged user namespaces for the Linux sandbox
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - id: gate
        uses: ./
        continue-on-error: true
        with:
          target: examples/notes
          artifact-name: mcpgt-report-${{ matrix.os }}
      - name: The known violation failed the gate
        env:
          OUTCOME: ${{ steps.gate.outcome }}
          VIOLATIONS: ${{ steps.gate.outputs.violations }}
        run: |
          test "$OUTCOME" = failure
          test "$VIOLATIONS" = 1
      - name: Without fail-on-violation the audit only reports
        uses: ./
        with:
          target: examples/notes
          fail-on-violation: "false"
          upload-report: "false"
