[project]
name = "mcpgt"
version = "0.1.0.dev0"
description = "Behavioral conformance harness for MCP tool annotations, validated against fixture servers with known ground truth."
requires-python = ">=3.11"
dependencies = [
    "mcp==2.3.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcpgt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
