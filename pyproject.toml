[project]
name = "mcpgt"
version = "0.1.0"
description = "Behavioral conformance harness for Model Context Protocol tool annotations."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
keywords = ["mcp", "model-context-protocol", "conformance", "testing", "tool-annotations"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
dependencies = [
    "mcp==2.3.0",
]

[project.urls]
Repository = "https://github.com/shreyasbhakta/mcp-groundtruth"
Methodology = "https://github.com/shreyasbhakta/mcp-groundtruth/blob/main/docs/methodology.md"
Changelog = "https://github.com/shreyasbhakta/mcp-groundtruth/blob/main/CHANGELOG.md"

[project.scripts]
mcpgt = "mcpgt.cli:main"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=8",
    "ruff>=0.17.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcpgt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    "RUF001", "RUF002", "RUF003",  # unicode arrows and dashes in docs and messages are intended
    "UP031",  # %-formatting is deliberate for hand-written raw JSON templates (no brace escaping)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B015", "B018"]  # tests deliberately evaluate comparisons for their exceptions

[tool.mypy]
python_version = "3.11"
packages = ["mcpgt"]
mypy_path = "src"
strict = true
warn_unreachable = true
